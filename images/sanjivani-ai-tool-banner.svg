<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#0A111F"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="460" rx="16" fill="url(#glowCyan)"/>
  <rect width="1200" height="460" rx="16" fill="url(#glowIndigo)"/>
  <rect width="1200" height="460" rx="16" fill="url(#glowEmerald)"/>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="458" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Cyber Grid Background Accent -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="460"/>
    <line x1="250" y1="0" x2="250" y2="460"/>
    <line x1="400" y1="0" x2="400" y2="460"/>
    <line x1="550" y1="0" x2="550" y2="460"/>
    <line x1="700" y1="0" x2="700" y2="460"/>
    <line x1="850" y1="0" x2="850" y2="460"/>
    <line x1="1000" y1="0" x2="1000" y2="460"/>
    <line x1="1150" y1="0" x2="1150" y2="460"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
  </g>

  <!-- Top Badge: Official Project -->
  <g transform="translate(600, 50)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="url(#pillGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <circle cx="-165" cy="0" r="5" fill="#10B981" filter="url(#glowFilter)"/>
    <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="1.5">OFFICIAL AI GATEWAY &amp; FIREWALL</text>
  </g>

  <!-- Central Shield & Network Emblem -->
  <g transform="translate(600, 140)">
    <!-- Ambient Aura -->
    <circle cx="0" cy="0" r="46" fill="#06B6D4" opacity="0.15" filter="url(#glowFilter)"/>
    
    <!-- Shield Shape -->
    <path d="M0 -34 L28 -18 C28 12 16 32 0 42 C-16 32 -28 12 -28 -18 Z" fill="url(#shieldGrad)" opacity="0.95"/>
    
    <!-- Neural Hub Inside Shield -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    <circle cx="-12" cy="-10" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="12" cy="-10" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-10" cy="12" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="12" cy="12" r="3" fill="#FFFFFF" opacity="0.9"/>
    <line x1="0" y1="0" x2="-12" y2="-10" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="12" y2="-10" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-10" y2="12" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="12" y2="12" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Main Title: SANJIVANI AI TOOL -->
  <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="2">
    SANJIVANI AI TOOL
  </text>

  <!-- Subtitle -->
  <text x="600" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">
    Unified AI Multi-Model Gateway &amp; 9-Layer Prompt Injection Security Firewall
  </text>

  <!-- Author Attribution Line -->
  <text x="600" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="1">
    DEVELOPED BY <tspan fill="#38BDF8">ADITYA TAYDE</tspan> • <tspan fill="#A78BFA">SANJIVANI UNIVERSITY</tspan>
  </text>

  <!-- Feature Metric Pills -->
  <g transform="translate(600, 385)">
    <!-- Pill 1: 358 Providers -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">⚡ 358 AI Providers</text>
    </g>

    <!-- Pill 2: 9-Category Firewall -->
    <g transform="translate(-120, 0)">
      <rect x="-115" y="-18" width="230" height="36" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle">🛡️ 9-Category Firewall</text>
    </g>

    <!-- Pill 3: 100% Defense Verified -->
    <g transform="translate(130, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#818CF8" text-anchor="middle">🎯 100% Benchmark Pass</text>
    </g>

    <!-- Pill 4: Strict Copyright -->
    <g transform="translate(370, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FB7185" text-anchor="middle">🔒 Sole Brand Rights</text>
    </g>
  </g>
</svg>
