<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="logoBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="logoGlowCyan" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logoGlowEmerald" cx="50%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Accent Gradient -->
    <linearGradient id="shieldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Core Emblem Gradient -->
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Filter for subtle drop-shadow/glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect width="512" height="512" rx="100" fill="url(#logoBg)"/>
  <rect width="512" height="512" rx="100" fill="url(#logoGlowCyan)"/>
  <rect width="512" height="512" rx="100" fill="url(#logoGlowEmerald)"/>

  <!-- Border Outline -->
  <rect x="2" y="2" width="508" height="508" rx="98" stroke="url(#shieldAccent)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle Circuit Grid Dots -->
  <g opacity="0.18" fill="#38BDF8">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="140" cy="80" r="2"/>
    <circle cx="200" cy="80" r="2"/>
    <circle cx="80" cy="140" r="2"/>
    <circle cx="432" cy="80" r="3"/>
    <circle cx="372" cy="80" r="2"/>
    <circle cx="432" cy="140" r="2"/>
    <circle cx="80" cy="432" r="3"/>
    <circle cx="432" cy="432" r="3"/>
  </g>

  <!-- Shield Perimeter Frame -->
  <g filter="url(#logoGlow)">
    <path d="M256 70 L380 120 V250 C380 340 320 410 256 440 C192 410 132 340 132 250 V120 Z" 
          fill="#0B132B" 
          fill-opacity="0.8" 
          stroke="url(#shieldAccent)" 
          stroke-width="8" 
          stroke-linejoin="round"/>
  </g>

  <!-- Stylized "S" & Neural Core Inside Shield -->
  <g>
    <!-- Stylized Neural S-Curve -->
    <path d="M315 175 C295 155 240 155 215 180 C190 205 200 240 250 255 C305 272 320 305 295 335 C270 365 205 360 185 335" 
          stroke="url(#coreGrad)" 
          stroke-width="22" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Neural Nodes -->
    <circle cx="315" cy="175" r="9" fill="#10B981"/>
    <circle cx="215" cy="180" r="7" fill="#38BDF8"/>
    <circle cx="250" cy="255" r="10" fill="#FFFFFF"/>
    <circle cx="295" cy="335" r="7" fill="#818CF8"/>
    <circle cx="185" cy="335" r="9" fill="#06B6D4"/>

    <!-- Connecting Spark Lines -->
    <line x1="250" y1="255" x2="350" y2="255" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="350" cy="255" r="5" fill="#38BDF8"/>

    <line x1="250" y1="255" x2="150" y2="255" stroke="#10B981" stroke-width="3" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="150" cy="255" r="5" fill="#10B981"/>
  </g>
</svg>
